<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Docs Console Full Page</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Concept: the whole Docs page in the console's dark, compact style. A fixed strip of numbers on top, one row of tabs below, one view at a time. */
:root{--bg:#060810;--panel:#0d121c;--panel2:#0a0e17;--line:#1c2740;--line-soft:#223050;--text:#c9d6f0;--dim:#6a8098;--blue:#4b8bff;--green:#39ff88;--amber:#ffb454;--red:#ff4d5e;--violet:#b98bff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Consolas,"Courier New",monospace;font-size:12px;padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.note{color:var(--dim);font-size:11px;border:1px dashed var(--line);border-radius:6px;padding:6px 10px}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:8px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:26px;height:26px;border-radius:6px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700}
.brand b{font-size:13px;letter-spacing:.4px}.brand span{color:var(--dim);font-size:11px;display:block}
.vs{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.vs a{font-size:10px;letter-spacing:.5px;text-transform:uppercase;padding:4px 10px;color:var(--dim);background:var(--panel2);text-decoration:none;cursor:default}
.vs a.on{color:var(--text);background:var(--panel);border-left:2px solid var(--blue);padding-left:8px}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:820px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.strip{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.lbl{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.stat{display:flex;gap:10px;align-items:center}
.stat .n{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.stat .s{color:var(--dim);font-size:11px}
.ring{width:42px;height:42px;flex:none}
.next{border-color:var(--amber);display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.next b{color:var(--amber)}
.cmd{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:3px 8px;color:var(--blue)}
.btn{font:inherit;font-size:11px;border:1px solid var(--blue);color:#fff;background:var(--blue);border-radius:5px;padding:4px 10px;cursor:pointer}
.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tab{border:1px solid var(--line);border-radius:6px;padding:4px 10px;font:inherit;font-size:11px;color:var(--dim);background:transparent;cursor:pointer;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--text);border-color:var(--line-soft)}.tab.on{color:var(--text);border-color:var(--blue)}
.cnt{color:var(--dim);font-size:10px}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.dot{width:7px;height:7px;border-radius:50%}.dot.done{background:var(--green)}.dot.now{background:var(--amber)}.dot.todo{border:1px solid var(--dim)}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px}
@media(max-width:780px){.two{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:12px}
.pill{border-radius:10px;padding:1px 8px;font-size:10px;border:1px solid var(--line-soft);color:var(--dim);white-space:nowrap}
.p-g{color:var(--green);border-color:var(--green)}.p-a{color:var(--amber);border-color:var(--amber)}.p-r{color:var(--red);border-color:var(--red)}.p-b{color:var(--blue);border-color:var(--blue)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;font-size:9.5px;color:var(--dim);text-transform:uppercase;padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px;border-bottom:1px solid var(--line-soft);vertical-align:top}tr:last-child td{border-bottom:none}
.tag{color:var(--violet)}
.loop{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 10px;margin:0}.loop dt{color:var(--dim)}.loop dd{margin:0}
.bar{height:6px;background:var(--line);border-radius:3px;position:relative;flex:1;min-width:100px}.bar i{position:absolute;inset:0 auto 0 0;background:var(--amber);border-radius:3px}.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text)}
.chk{display:flex;flex-direction:column;gap:5px}.chk div{display:flex;gap:8px;align-items:baseline}.ok{color:var(--green)}.no{color:var(--amber)}
.small{color:var(--dim);font-size:11px;line-height:1.5}
.tl{display:flex;gap:0;align-items:flex-start;overflow-x:auto;padding:6px 2px 2px}
.tl div{flex:1;min-width:92px;text-align:center;position:relative;font-size:10.5px;color:var(--dim)}
.tl div:before{content:"";position:absolute;left:0;right:0;top:5px;height:2px;background:var(--line)}
.tl div i{position:relative;display:block;width:12px;height:12px;border-radius:50%;margin:0 auto 5px;background:var(--panel);border:2px solid var(--dim)}
.tl div.d i{background:var(--green);border-color:var(--green)}.tl div.c i{border-color:var(--amber)}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.doc b{display:block;font-size:12px}.doc span{color:var(--dim);font-size:11px}
.new{background:var(--blue);color:#fff;border-radius:4px;padding:0 5px;font-size:9px;font-weight:700;margin-left:4px}
</style>

<div class="wrap">
  <div class="note">Mockup of the complete Docs page with the project's first phase inside it. Example data: Chicken Roundup. Click the tabs.</div>

  <div class="hdr">
    <div class="brand"><div class="logo">K</div><div><b>UEFN Dream Bot Team</b><span>Docs · Chicken Roundup</span></div></div>
    <div class="vs"><a>Console</a><a>Stats</a><a class="on">Docs</a><a>Flow</a><a>Skills</a><a>Score</a><a>News</a></div>
  </div>

  <div class="strip" id="strip"></div>
  <div class="card next" id="next"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="view" class="stack"></div>
</div>

<script>
var TABS=[
 {id:"idea",n:"Idea",d:"done"},{id:"spec",n:"Spec",d:"done"},{id:"plan",n:"Plan",d:"now"},
 {sep:1},
 {id:"road",n:"Roadmap",c:"0/6"},{id:"bugs",n:"Bugs",c:"2"},{id:"status",n:"Status"},{id:"docs",n:"Documents",c:"13"}
];
var CUR="plan";
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function ring(p,col){var c=2*Math.PI*15;return '<svg class="ring" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="20" cy="20" r="15" fill="none" stroke="'+col+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+(c*(1-p/100)).toFixed(1)+'" transform="rotate(-90 20 20)"/></svg>';}
function strip(){
 document.getElementById("strip").innerHTML=
 '<div class="card"><div class="lbl">Journey</div><div class="stat"><span class="n">3<span class="s"> / 6</span></span><span class="s">idea, spec done · plan to approve</span></div></div>'+
 '<div class="card"><div class="lbl">Roadmap progress</div><div class="stat">'+ring(0,"var(--green)")+'<span><span class="n">0%</span><div class="s">0 of 6 tasks done</div></span></div></div>'+
 '<div class="card"><div class="lbl">Bug fixing</div><div class="stat">'+ring(33,"var(--green)")+'<span><span class="n">1/3</span><div class="s">2 open · 1 fixed by the kit</div></span></div></div>'+
 '<div class="card"><div class="lbl">Release P0-R1</div><div class="stat"><span class="n">0<span class="s"> / 6</span></span><span class="s">next release, not started</span></div></div>';
 document.getElementById("next").innerHTML='<div><div class="lbl">Next action</div><b>Approve the plan: 2 stories, 1 high risk, 1 step by hand</b></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="cmd">/piano</span><button class="btn">Open the plan</button></div>';
}
function tabs(){
 document.getElementById("tabs").innerHTML=TABS.map(function(t){
  if(t.sep)return '<span class="sep"></span>';
  return '<button class="tab'+(t.id===CUR?' on':'')+'" role="tab" aria-selected="'+(t.id===CUR)+'" data-t="'+t.id+'">'+(t.d?'<span class="dot '+t.d+'"></span>':'')+esc(t.n)+(t.c?' <span class="cnt">'+t.c+'</span>':'')+'</button>';}).join("");
 Array.prototype.forEach.call(document.querySelectorAll("#tabs .tab"),function(b){b.onclick=function(){CUR=b.getAttribute("data-t");render();};});
}
var V={
idea:function(){return '<div class="two"><div class="card"><div class="lbl">Idea</div><div style="line-height:1.5">A single-player farm game: tame the wandering chickens and bring them back to the pen before time runs out.</div><div class="lbl" style="margin-top:12px">Genre <span class="pill p-g">confirmed by you</span></div>survival<div class="lbl" style="margin-top:12px">Loop (MVP)</div><dl class="loop"><dt>Action</dt><dd>Pick up a chicken; it follows you</dd><dt>Rule</dt><dd>3 minute round, follows within a few metres</dd><dt>Reward</dt><dd>Each chicken in the pen adds points</dd><dt>End</dt><dd>Time out, or all chickens in the pen</dd><dt>Replay</dt><dd>New spawn places: beat your score</dd></dl></div>'+
 '<div class="stack"><div class="card"><div class="lbl">Score of the idea</div><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span style="font-size:24px;font-weight:700">71</span><span class="small">of 100</span><div class="bar"><i style="width:71%"></i><u style="left:60%"></u></div></div><div class="small" style="margin-top:6px">Threshold 60 · build it with a smaller scope</div></div><div class="card"><div class="lbl">Variants scored</div><div class="chk"><div><span class="ok">●</span>A Chicken Roundup<b style="margin-left:auto">71</b></div><div><span class="no">●</span>B Egg Rush<b style="margin-left:auto">64</b></div><div><span class="no">●</span>C Barn Keeper<b style="margin-left:auto">58</b></div></div></div></div></div>';},
spec:function(){return '<div class="two"><div class="card"><div class="lbl">Spec checklist <span class="pill p-g">ready · approved</span></div><div class="chk">'+['Loop in 5 lines','Story P1 with an independent test','Given / when / then','3 success criteria, measurable in game','Assumptions written (3)','Technical risks with level (3)','No open question'].map(function(x){return '<div><span class="ok">✓</span>'+x+'</div>';}).join("")+'</div></div>'+
 '<div class="card"><div class="lbl">Technical risks</div><div class="scroll"><table><tr><th>#</th><th>Risk</th><th>Level</th></tr><tr><td>R1</td><td>Spawner and pen references assigned by hand</td><td><span class="pill p-r">high</span></td></tr><tr><td>R2</td><td>Assets not allowed on a playable island</td><td><span class="pill p-a">medium</span></td></tr><tr><td>R3</td><td>Chickens stop following at some distances</td><td><span class="pill p-a">medium</span></td></tr></table></div></div></div>';},
plan:function(){return '<div class="card"><div class="lbl">Plan by story</div><div class="scroll"><table><tr><th>Story</th><th>Devices</th><th>Assets</th><th>By hand</th><th>Status</th></tr><tr><td><b>S1</b> Round up the chickens <span class="tag">P1</span></td><td>3 (1 to explore)</td><td>3 (1 import, 1 create)</td><td>@editable references</td><td><span class="pill p-a">to approve</span></td></tr><tr><td><b>S2</b> Two chickens at once <span class="tag">P2</span></td><td>1 skill</td><td>none new</td><td>none</td><td><span class="pill p-a">to approve</span></td></tr></table></div></div>'+
 '<div class="two"><div class="card"><div class="lbl">Build order</div><div class="chk"><div><span class="no">1</span>Pass 1: S1, the loop playable</div><div><span class="no">2</span>Pass 2: sounds, pen, effects</div><div><span class="no">·</span>One chicken alone before the flock</div></div></div><div class="card"><div class="lbl">Coherence</div><div class="chk"><div><span class="ok">✓</span>Spec ready for planning</div><div><span class="ok">✓</span>Principles approved</div><div><span class="ok">✓</span>No conflict with the principles</div><div><span class="no">!</span>No tasks yet</div></div></div></div>';},
road:function(){return '<div class="card"><div class="lbl">Phases</div><div class="scroll"><table><tr><th>ID</th><th>Phase</th><th>Exit criteria</th><th>Status</th></tr><tr><td>PH-0</td><td>MVP</td><td>One playtest with up to 3 players completes the loop</td><td><span class="pill p-a">Active</span></td></tr><tr><td>PH-1</td><td>Launch</td><td>set when phase 0 closes</td><td><span class="pill">Planned</span></td></tr></table></div></div>'+
 '<div class="card"><div class="lbl">Task timeline</div><div class="tl"><div class="c"><i></i>T-001</div><div><i></i>T-002</div><div><i></i>T-003</div><div><i></i>T-004</div><div><i></i>T-005</div><div><i></i>T-006</div></div></div>'+
 '<div class="card"><div class="lbl">Open tasks by release · P0-R1</div><div class="scroll"><table><tr><th>ID</th><th>Feature</th><th>Acceptance criteria</th><th>Priority</th></tr>'+
 [['T-001','Verse device with references <span class="tag">[S1] [R1]</span>','Owner assigns the references, build is clean','MVP'],['T-002','Area from allowed assets <span class="tag">[S1] [R2] (after T-001)</span>','Session validation shows no asset error','MVP'],['T-003','One chicken follows the player <span class="tag">[S1] [R3] (after T-001)</span>','Follows at the set distance for 1 minute','MVP'],['T-004','Deliver to the pen and score <span class="tag">[S1] (after T-003)</span>','One chicken adds one step, counted once','MVP'],['T-005','Round timer and end <span class="tag">[S1] [P]</span>','Ends at 3 minutes or when all are in the pen','MVP'],['T-006','Several chickens together <span class="tag">[S2] (after T-004)</span>','Two delivered together count two','High']].map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>';}).join("")+'</table></div><div class="small" style="margin-top:8px">Preview: shown after /compiti. Backlog (release Later): empty.</div></div>';},
bugs:function(){return '<div class="two"><div class="card"><div class="lbl">Open bugs by severity</div><div class="scroll"><table><tr><th>ID</th><th>Bug</th><th>Class</th><th>Severity</th></tr><tr><td>B-001</td><td>Chickens stop following past 8 metres</td><td><span class="pill p-a">medium</span></td><td>High</td></tr><tr><td>B-002</td><td>Score counts a chicken twice at the gate</td><td><span class="pill p-r">major</span></td><td>High</td></tr></table></div></div>'+
 '<div class="card"><div class="lbl">Fixed by the kit <span class="pill p-g">auto</span></div><div class="scroll"><table><tr><th>When</th><th>What</th><th>Way back</th></tr><tr><td>14:02</td><td>Verse header updated in chicken_roundup.verse</td><td><span class="cmd">undo</span></td></tr></table></div><div class="small" style="margin-top:8px">Only minor bugs from the closed list in the principles. Limit: 3 attempts per bug.</div></div></div>';},
status:function(){return '<div class="card"><div class="lbl">Recent status · priorities and owner actions</div><div class="chk"><div><span class="no">!</span>Approve the plan (you)</div><div><span class="no">!</span>Assign the spawner and pen references by hand after T-001 (you)</div><div><span class="ok">✓</span>Spec approved, score 71</div><div><span class="ok">✓</span>Genre confirmed: survival</div></div></div>';},
docs:function(){var D=[["GAME-SPEC.md","The idea, loop, stories, risks",1],["CONSTITUTION.md","Principles and what is forbidden",1],["PLAN.md","Devices, assets, build order",1],["ROADMAP.md","Task table",0],["STATUS.md","Current state and log",0],["SPEC.md","Structure deduced from code",0],["BUGS.md","Backlog and fix roadmap",0],["RETENTION-NOTES.md","Retention proposals",0],["TEST-PLAN.md","Test plan",0],["DESIGN-SYSTEM.md","UI and style",0],["DEPENDENCY-MAP.md","Who uses what",0],["RELEASE-READINESS.md","Release gate",0]];
 return '<div class="card"><div class="lbl">Documentation</div><div class="docs">'+D.map(function(d){return '<div class="card doc"><b>'+d[0]+(d[2]?'<span class="new">NEW</span>':'')+'</b><span>'+d[1]+'</span></div>';}).join("")+'</div></div>';}
};
function render(){strip();tabs();document.getElementById("view").innerHTML=V[CUR]();}
render();
</script>

</body></html>
