{id:"visuals",n:"Visuals",g:"primary",w:10,T:[1,2,3,4,4,4],B:[.5,1,1.5,2.5],V:[0,.5,1,2],tip:"Pick one style and keep it: a coherent small look beats a mixed rich one."},

{id:"bonus",n:"LLM characters",g:"bonus",w:0,T:[0,0,1,3,3,3],B:[0,0,0,1],V:[0,0,0,.5],tip:"Optional track: a talking NPC with the UEFN conversations feature."}
];
C.forEach(function(c){c.T=c.T;});

// Traffic light: the later the release, the less gap we accept. red = act now, yellow = watch, green = fine.
function light(t,v,rel){var ph=rel/5,gap=t-v,red=1.5-0.5*ph,yel=0.7-0.3*ph,l=gap>=red?"red":(gap>=yel?"yellow":"green");
 if(ph>=0.6&&t>0){if(v<1.5)l="red";else if(v<2.5&&l=="green")l="yellow";}return l;}
function calc(rel){
 var rows=C.map(function(c){var k=Math.min(rel,LAST),t=c.T[rel],b=c.B[k],v=c.V[k],pv=rel>0?c.V[Math.min(rel-1,LAST)]:0,gap=Math.max(0,t-v);
  var l=c.w==0&&t==0?"na":light(t,v,rel);if(c.g=="bonus"&&l=="red")l="yellow";return {c:c,t:t,b:b,v:v,d:rel>0&&rel<=LAST?v-pv:0,gap:gap,l:l,score:c.w?gap*c.w:gap*2,pts:c.w?gap/5*c.w:0,pl:rel>0?light(c.T[rel-1],pv,rel-1):l};});
 var rk=rows.filter(function(r){return r.l=="red"||r.l=="yellow";}).sort(function(a,b){return (b.l=="red")-(a.l=="red")||b.score-a.score;});rk.forEach(function(r,i){r.rank=i+1;});
 function tot(f){var e=0,o=0;rows.forEach(function(r){if(r.c.g=="primary")e+=f(r);else if(r.c.g=="additional")o+=f(r)/5*r.c.w;});return Math.round(e/35*70+o);}
 return {rows:rows,plan:tot(function(r){return r.t;}),built:tot(function(r){return r.b;}),proven:tot(function(r){return r.v;}),
  red:rows.filter(function(r){return r.l=="red"&&r.c.g!="bonus";}).length,yellow:rows.filter(function(r){return r.l=="yellow"&&r.c.g!="bonus";}).length,green:rows.filter(function(r){return r.l=="green"&&r.c.g!="bonus";}).length};}

 na:['#7f8fb0','<path d="M6 10h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>','<circle cx="10" cy="10" r="9" fill="#7f8fb0" fill-opacity=".5"/>']}[l];
 var t={red:"Act now",yellow:"Watch",green:"Fine",na:"Not planned"}[l];return '<span class="tl" title="'+t+'"><svg viewBox="0 0 20 20" width="20" height="20">'+m[2]+m[1]+'</svg></span>';}

 return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><polyline points="'+t+'" fill="none" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="3 3"/><polyline points="'+v.join(" ")+'" fill="none" stroke="var(--proven)" stroke-width="2"/></svg>';}
