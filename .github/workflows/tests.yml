name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests, privacy scan, skill validator
        run: python tests/run_all.py
  release-gate:
    # A tag push only counts as a release if the tests job passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - run: echo "tests passed for ${{ github.ref_name }}"
